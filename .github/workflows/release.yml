name: Release

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

jobs:
  check_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version_check
        run: |
          PLUGIN_FILE=plugin/clipisode/clipisode.php
          OLD_VERSION=$(git show HEAD^:"$PLUGIN_FILE" 2>/dev/null | sed -n 's/.*Version: *//p' | head -n1 | tr -d '[:space:]')
          NEW_VERSION=$(git show HEAD:"$PLUGIN_FILE" | sed -n 's/.*Version: *//p' | head -n1 | tr -d '[:space:]')
          if [ -z "$OLD_VERSION" ] || [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "No version change detected"
            exit 0
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version changed from $OLD_VERSION to $NEW_VERSION"

      - name: Setup Node
        if: steps.version_check.outputs.new_version
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/clipisode/package-lock.json

      - name: Build plugin zip
        if: steps.version_check.outputs.new_version
        working-directory: plugin/clipisode
        run: npm ci && npm run plugin

      - name: Package video theme plugins
        if: steps.version_check.outputs.new_version
        working-directory: plugin
        run: |
          zip -q -r clipisode-community-theme.zip clipisode-community-theme
          zip -q -r clipisode-studio-theme.zip clipisode-studio-theme

      - name: Create Release
        if: steps.version_check.outputs.new_version
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version_check.outputs.new_version }}
          files: |
            plugin/clipisode/clipisode.zip
            plugin/clipisode-community-theme.zip
            plugin/clipisode-studio-theme.zip
          generate_release_notes: true
